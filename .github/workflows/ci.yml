name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  etl:
    name: ETL (Python) — lint e testes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      CPF_HMAC_SECRET: ci-somente-teste
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: etl/uv.lock
      - name: Esquema do banco (migrações + seed)
        run: |
          # O esquema referencia auth.users (Supabase). No Postgres puro do CI criamos um stub mínimo.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists auth;
          create table if not exists auth.users (id uuid primary key);
          create or replace function auth.uid() returns uuid language sql stable as $$ select null::uuid $$;
          do $$ begin
            if not exists (select from pg_roles where rolname = 'authenticated') then create role authenticated; end if;
            if not exists (select from pg_roles where rolname = 'anon') then create role anon; end if;
          end $$;
          SQL
          for f in supabase/migrations/*.sql; do echo "→ $f"; psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"; done
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f supabase/seed.sql
      - name: Lint
        working-directory: etl
        run: uv run ruff check raiox tests
      - name: Testes
        working-directory: etl
        run: uv run pytest -q

  web:
    name: Site — lint, tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @raiox/core test
      - run: pnpm --filter @raiox/core typecheck
      - run: pnpm --filter web lint
      - run: pnpm --filter web typecheck
      - name: Build com dados fictícios (fixtures)
        run: |
          pnpm --filter web dados:fixture
          RAIOX_PERMITIR_FIXTURE=1 pnpm --filter web build
      - name: Orçamento de arquivos (Cloudflare Pages ≤ 20.000)
        run: |
          n=$(find apps/web/out -type f | wc -l)
          echo "Arquivos no build: $n"
          test "$n" -lt 20000
      - name: E2E (Playwright + axe)
        run: |
          pnpm --filter web exec playwright install --with-deps chromium webkit
          pnpm --filter web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
