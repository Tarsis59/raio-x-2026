[project]
name = "raiox-etl"
version = "0.1.0"
description = "Coleta, normalização e publicação de dados públicos — Raio-X 2026"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "playwright>=1.55",
  "pypdfium2>=4.30",
  "anthropic>=0.60",
  "tenacity>=9.0",
  "python-dotenv>=1.0",
  "orjson>=3.10",
  "truststore>=0.10.4",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7", "respx>=0.21"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["raiox"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
